version: '3.8'

services:
  # ============================================
  # 基础设施
  # ============================================

  mysql:
    image: mysql:8.0
    container_name: mt-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # 启动时自动执行 SQL
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - movie-net

  redis:
    image: redis:7-alpine
    container_name: mt-redis
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - movie-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mt-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - movie-net

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: mt-xxl-job
    ports:
      - "8088:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root123
        --xxl.job.accessToken=default_token
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - movie-net

  # ============================================
  # 业务服务
  # ============================================

  gateway:
    build: ./gateway
    container_name: mt-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - NACOS_ADDR=nacos
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - movie-net

  user-service:
    build: ./user-service
    container_name: mt-user-service
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - NACOS_ADDR=nacos
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - movie-net

  movie-service:
    build: ./movie-service
    container_name: mt-movie-service
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - NACOS_ADDR=nacos
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - movie-net

  session-service:
    build: ./session-service
    container_name: mt-session-service
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - NACOS_ADDR=nacos
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movie-net

  order-service:
    build: ./order-service
    container_name: mt-order-service
    ports:
      - "8084:8084"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx128m
      - NACOS_ADDR=nacos
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      xxl-job-admin:
        condition: service_started
    networks:
      - movie-net

# ============================================
# 卷 & 网络
# ============================================
volumes:
  mysql-data:

networks:
  movie-net:
    driver: bridge
    name: movie-ticketing-net
