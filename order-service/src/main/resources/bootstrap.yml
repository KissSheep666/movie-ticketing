feign:
  sentinel:
    enabled: true

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos}:8848
        namespace: movie-ticketing
      config:
        server-addr: ${NACOS_ADDR:nacos}:8848
        namespace: movie-ticketing
        file-extension: yml
        shared-configs:
          - data-id: common.yml
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      transport:
        dashboard: sentinel-dashboard:8858
      eager: true

server:
  port: 8084
